apiVersion: v1
kind: Pod
metadata:
  name: no-resources
  namespace: default
spec:
  containers:
    - name: app
      image: registry.example.com/app:1.2.3
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: default
spec:
  containers:
    - name: app
      image: registry.example.com/app:1.2.3
      securityContext: { privileged: true }
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 128Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: host-network
  namespace: default
spec:
  hostNetwork: true
  containers:
    - name: app
      image: registry.example.com/app:1.2.3
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 128Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: latest-tag
  namespace: default
spec:
  containers:
    - name: app
      image: registry.example.com/app:latest
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 128Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: no-tag
  namespace: default
spec:
  containers:
    - name: app
      image: registry.example.com:5000/app
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 128Mi }
