apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resources
spec:
  {{- include "kyverno-policies.common" . | nindent 2 }}
  validations:
    - expression: "variables.containers.all(c, has(c.resources) && has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests && has(c.resources.limits) && 'memory' in c.resources.limits)"
      message: "Every container needs CPU and memory requests and a memory limit."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
spec:
  {{- include "kyverno-policies.common" . | nindent 2 }}
  validations:
    - expression: "variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)"
      message: "Privileged containers are not allowed."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-namespaces
spec:
  {{- include "kyverno-policies.common" . | nindent 2 }}
  validations:
    - expression: "object.spec.?hostNetwork.orValue(false) == false && object.spec.?hostPID.orValue(false) == false && object.spec.?hostIPC.orValue(false) == false"
      message: "Host network, PID and IPC namespaces are not allowed."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  {{- include "kyverno-policies.common" . | nindent 2 }}
  validations:
    - expression: "variables.containers.all(c, c.image.contains('@') || (c.image.split('/')[size(c.image.split('/')) - 1].contains(':') && !c.image.endsWith(':latest')))"
      message: "Images must use an explicit tag other than latest, or a digest."
