name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/tools.sh actionlint d2 terraform tofu tflint
      - run: make lint
  test:
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          CLI: ${{ matrix.cli }}
        run: scripts/tools.sh "$CLI"
      - env:
          CLI: ${{ matrix.cli }}
        run: make test-iac CLI="$CLI"
  diagram:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/tools.sh d2
      - run: make diagram
      - run: python3 scripts/png_width.py docs/img/architecture.png --min 2400 --max 4000 --aspect-min 1.4 --aspect-max 2.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: architecture
          path: docs/img/
          if-no-files-found: error
